version: "3.8"

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.4
    container_name: zookeeper
    hostname: zookeeper
    env_file:
      - ./env/zookeeper.env
    ports:
      - "2181:2181"
    networks:
      - hi-vis-vest-usage-control-system-network

  # брокер сообщений между общим хранилищем видеозаписей и [модулями детекции и трекинга]
  # можно ещё kafka-ui добавить
  record-storage-broker:
    image: confluentinc/cp-kafka:7.4.4
    container_name: record-storage-broker
    hostname: record-storage-broker
    depends_on:
      - zookeeper
    env_file:
      - ./env/record-storage-broker.env
    ports:
      - "9092:9092"
      - "29092:29092"
    networks:
      - hi-vis-vest-usage-control-system-network

  # общее хранилище, в которое попадают все записи с камер
  entry-record-storage:
    image: minio/minio:latest
    container_name: entry-record-storage
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - ./env/entry-record-storage.env
    volumes:
      - ./volume/entry-record-storage:/data
    restart: unless-stopped
    networks:
      - hi-vis-vest-usage-control-system-network

  entry-record-storage-initializer:
    image: minio/mc:latest
    container_name: entry-record-storage-initializer
    depends_on:
      - entry-record-storage
      - record-storage-broker
    env_file:
      - ./env/entry-record-storage.env
    volumes:
      - ./init/entry-record-storage.bash:/entry-record-storage.bash
    entrypoint: >
      /bin/sh -c "
      chmod +x /entry-record-storage.bash;
      /entry-record-storage.bash;
      "
    networks:
      - hi-vis-vest-usage-control-system-network  

  # вспомогательный сервис, в который MinIO будет слать уведомления: эдакая обёртка над Kafka
  notification-service:
    build:
      context: ./service/notification-service
    container_name: notification-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./service/notification-service/notification-service.env
    depends_on:
      - record-storage-broker
      - entry-record-storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://notification-service:8000/minio-webhook"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - hi-vis-vest-usage-control-system-network

  # хранилище выявленных треков
  track-storage:
    image: mongo:latest
    container_name: track-storage
    restart: always
    env_file:
      - ./env/track-storage.env
    ports:
      - "27017:27017"
    volumes:
      - ./volume/track-storage:/data/db
      - ./init/track-storage:/docker-entrypoint-initdb.d:ro
    networks:
      - hi-vis-vest-usage-control-system-network

  track-storage-ui:
    image: mongo-express:latest
    container_name: track-storage-ui
    restart: always
    ports:
      - "7017:8081"
    env_file:
      - ./env/track-storage-ui.env
    depends_on:
      - track-storage
    networks:
      - hi-vis-vest-usage-control-system-network

  # хранилище изображений, вырезанных из видео по трекам
  crop-storage:
    image: minio/minio:latest
    container_name: crop-storage
    command: server /data --console-address ":9001"
    ports:
      - "9002:9000"
      - "9003:9001"
    env_file:
      - ./env/crop-storage.env
    volumes:
      - ./volume/crop-storage:/data
    restart: unless-stopped
    networks:
      - hi-vis-vest-usage-control-system-network

  crop-storage-initializer:
    image: minio/mc:latest
    container_name: crop-storage-initializer
    depends_on:
      - crop-storage
    env_file:
      - ./env/crop-storage.env
    volumes:
      - ./init/crop-storage.bash:/crop-storage.bash
    entrypoint: >
      /bin/sh -c "
      chmod +x /crop-storage.bash;
      /crop-storage.bash;
      "
    networks:
      - hi-vis-vest-usage-control-system-network

  # модуль формирования треков передвижения людей
  detection-tracking-module:
    build:
      context: ./module/detection-tracking-module
    container_name: detection-tracking-module
    restart: unless-stopped
    ports:
      - "6000:5000"
    depends_on:
      - track-storage
      - crop-storage
      - record-storage-broker
      - entry-record-storage
    env_file:
      - ./module/detection-tracking-module/detection-tracking-module.env
    volumes:
      - ./module/detection-tracking-module/uploads:/app/uploads
      - ./module/detection-tracking-module/models:/app/models
    networks:
      - hi-vis-vest-usage-control-system-network

  # брокер сообщений между [модулями детекции и трекинга] и [модулями классификации]
  detection-broker:
    image: confluentinc/cp-kafka:7.4.4
    container_name: detection-broker
    hostname: detection-broker
    depends_on:
      - zookeeper
    env_file:
      - ./env/detection-broker.env
    ports:
      - "9093:9092"
      - "29093:29092"
    networks:
      - hi-vis-vest-usage-control-system-network

  # модуль классификации наличия жилета
  classification-module:
    build:
      context: ./module/classification-module
    container_name: classification-module
    restart: unless-stopped
    ports:
      - "6001:5000"  
    env_file:
      - ./module/classification-module/classification-module.env
    depends_on:
      - detection-broker
      - accident-broker
      - crop-storage
    volumes:
      - ./module/classification-module/config:/app/config
      - ./module/classification-module/models:/app/models
    networks:
      - hi-vis-vest-usage-control-system-network

  # брокер сообщений между [модулями классификации] и [регистратором инцидентов]
  accident-broker:
    image: confluentinc/cp-kafka:7.4.4
    container_name: accident-broker
    hostname: accident-broker
    depends_on:
      - zookeeper
    env_file:
      - ./env/accident-broker.env
    ports:
      - "9094:9092"
      - "29094:29092"
    networks:
      - hi-vis-vest-usage-control-system-network

  # база для метаданных регистратора инцидентов
  accident_database:
    image: postgres:15
    container_name: accident-database
    hostname: accident-database
    env_file:
      - ./env/accident_database.env
    volumes:
      - ./volume/accident-database:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      retries: 5
      timeout: 5s
    ports:
      - "5432:5432"
    networks:
      - hi-vis-vest-usage-control-system-network

  accident-database-ui:
    image: dpage/pgadmin4:latest
    container_name: accident-database-ui
    hostname: accident-database-ui
    env_file:
      - ./env/accident-database-ui.env
    ports:
      - "5050:80"
    networks:
      - hi-vis-vest-usage-control-system-network

  # хранилище видеозаписей регистратора инцидентов
  accident-storage:
    image: minio/minio:latest
    container_name: accident-storage
    hostname: accident-storage
    command: server /data --console-address ":9001"
    ports:
      - "9004:9000"
      - "9005:9001"
    env_file:
      - ./env/accident-storage.env
    volumes:
      - ./volume/accident-storage:/data
    restart: unless-stopped
    networks:
      - hi-vis-vest-usage-control-system-network

  accident-storage-initializer:
    image: minio/mc:latest
    container_name: accident-storage-initializer
    hostname: accident-storage-initializer
    depends_on:
      - accident-storage
      - accident-broker
      - accident_database
    env_file:
      - ./env/accident-storage.env
    volumes:
      - ./init/accident-storage.bash:/accident-storage.bash
    entrypoint: >
      /bin/sh -c "
      chmod +x /accident-storage.bash;
      /accident-storage.bash;
      "
    networks:
      - hi-vis-vest-usage-control-system-network

  # сервис регистратор инцидентов
  accident-recorder-service:
    build:
      context: ./service/accident-recorder-service
    container_name: accident-recorder-service
    hostname: accident-recorder-service
    env_file:
      - ./service/accident-recorder-service/accident_recorder_service.env
    ports:
     - "8888:8080"
    restart: on-failure
    networks:
      - hi-vis-vest-usage-control-system-network

  # веб-интерфейс
  accident-recorder-frontend:
    build:
      context: ../frontend/hvucs-frontend
      dockerfile: Dockerfile.dev  # используем dev-версию Dockerfile
    container_name: accident-recorder-frontend
    ports:
      - "5555:5555"
      # Добавьте проброс порта для Vite HMR (обычно 24678)
      - "24678:24678"
    environment:
      - CHOKIDAR_USEPOLLING=true  # для файловых изменений в Docker
      - VITE_HMR_CLIENT_PORT=5555  # порт для HMR
    volumes:
      # Монтируем исходный код для hot-reload
      - ../frontend/hvucs-frontend:/app
      # Исключаем node_modules, чтобы не перезаписывать его
      - /app/node_modules
    networks:
      - hi-vis-vest-usage-control-system-network

  # accident-recorder-frontend:
  #   build:
  #     context: ../frontend/hvucs-frontend
  #   container_name: accident-recorder-frontend
  #   ports:
  #     - "5555:5555"
  #   networks:
  #     - hi-vis-vest-usage-control-system-network

networks:
  hi-vis-vest-usage-control-system-network:
    driver: bridge
    name: hi-vis-vest-usage-control-system-network