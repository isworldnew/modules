<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | Система контроля жилетов</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-wrapper">
        <!-- Жёлтый хедер -->
        <header class="header">
            <div class="container header-container">
                <h1 class="logo">Система контроля<br>световозвращающих жилетов</h1>
            </div>
        </header>

        <!-- Основной контент -->
        <main class="main">
            <div class="login-container">
                <div class="login-card">
                    <h2>Вход в систему</h2>
                    <form class="login-form">
                        <div class="form-group">
                            <label for="email">Электронная почта</label>
                            <input type="email" id="email" name="email" placeholder="ivanov@example.com" required>
                        </div>
                        <div class="form-group">
                            <label for="password">Пароль</label>
                            <input type="password" id="password" name="password" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn btn-yellow btn-block">Войти</button>
                    </form>
                </div>
            </div>
        </main>

        <!-- Светло-серый футер -->
        <footer class="footer">
            <div class="container">
                <p>© 2026 Система контроля световозвращающих жилетов</p>
            </div>
        </footer>
    </div>
</body>
</html>
